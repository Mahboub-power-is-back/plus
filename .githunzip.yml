name: Unzip File

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install unzip
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Verify file exists
      run: |
        echo "Listing files:"
        ls -la
        if [ ! -f "NorthAfrica-main.zip" ]; then
          echo "ZIP file not found!"
          exit 1
        fi

    - name: Unzip the file
      run: unzip -o NorthAfrica-main.zip -d extracted

    - name: Commit extracted files
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add extracted
        git commit -m "Unzipped NorthAfrica-main.zip" || echo "No changes to commit"
        git push
