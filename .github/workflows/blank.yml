name: Safe Unzip Workflow
on:
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Download ZIP file from raw GitHub URL
      - name: Download ZIP
        run: |
          FILE_URL="https://raw.githubusercontent.com/Mahboub-power-is-back/plus/refs/heads/main/NorthAfrica-main.zip"
          FILE_NAME="NorthAfrica-main.zip"
          curl -L -o "$FILE_NAME" "$FILE_URL"
          
          # Verify the download
          if [ ! -s "$FILE_NAME" ]; then
            echo "Error: File is missing or empty!"
            exit 1
          fi
          echo "Downloaded file:"
          ls -lh "$FILE_NAME"

      # Step 3: Test the ZIP file
      - name: Test ZIP Integrity
        run: |
          unzip -t NorthAfrica-main.zip || { echo "ZIP file is invalid or corrupted! Exiting."; exit 1; }

      # Step 4: Extract ZIP safely
      - name: Extract ZIP
        run: |
          DEST_DIR="./extracted"
          mkdir -p "$DEST_DIR"
          unzip -o NorthAfrica-main.zip -d "$DEST_DIR"

      # Step 5: List contents to verify
      - name: Verify extraction
        run: ls -l ./extracted
