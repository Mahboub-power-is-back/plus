name: Unzip File

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Unzip file
      run: |
        unzip yourfile.zip -d extracted

    - name: Commit extracted files
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        mkdir -p extracted
        git add extracted
        git commit -m "Unzipped file automatically" || echo "No changes"
        git push
