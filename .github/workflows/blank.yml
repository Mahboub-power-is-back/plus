name: Unzip NorthAfrica-main

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: List files (debug)
      run: ls -la

    - name: Unzip file
      run: |
        unzip NorthAfrica-main.zip -d extracted

    - name: Commit extracted files
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add extracted
        git commit -m "Unzipped NorthAfrica-main.zip" || echo "No changes"
        git push
