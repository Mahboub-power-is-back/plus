name: Safe Unzip Workflow
on:
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Download ZIP artifact or file
      - name: Download ZIP
        run: |
          FILE_URL="https://github.com/Mahboub-power-is-back/plus/releases/download/latest/NorthAfrica-main.zip"
          FILE_NAME="NorthAfrica-main.zip"
          wget -O "$FILE_NAME" "$FILE_URL"

      # Step 3: Test the ZIP file
      - name: Test ZIP Integrity
        run: |
          FILE_NAME="NorthAfrica-main.zip"
          unzip -t "$FILE_NAME" || { echo "ZIP file is corrupted! Exiting."; exit 1; }

      # Step 4: Extract safely
      - name: Extract ZIP
        run: |
          FILE_NAME="NorthAfrica-main.zip"
          DEST_DIR="./extracted"
          mkdir -p "$DEST_DIR"
          unzip -o "$FILE_NAME" -d "$DEST_DIR"
          
      # Step 5: List contents to verify
      - name: Verify extraction
        run: ls -l ./extracted
