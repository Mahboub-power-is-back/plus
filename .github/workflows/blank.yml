name: Download and Unzip into Repo
on:
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Download ZIP file from raw GitHub URL
      - name: Download ZIP
        run: |
          FILE_URL="https://raw.githubusercontent.com/Mahboub-power-is-back/plus/refs/heads/main/NorthAfrica-main.zip"
          FILE_NAME="NorthAfrica-main.zip"
          curl -L -o "$FILE_NAME" "$FILE_URL"
          
          # Verify the download
          if [ ! -s "$FILE_NAME" ]; then
            echo "Error: File is missing or empty!"
            exit 1
          fi
          echo "Downloaded file:"
          ls -lh "$FILE_NAME"

      # Step 3: Test the ZIP file
      - name: Test ZIP Integrity
        run: |
          unzip -t NorthAfrica-main.zip || { echo "ZIP file is invalid or corrupted! Exiting."; exit 1; }

      # Step 4: Extract ZIP into repo
      - name: Extract ZIP
        run: |
          unzip -o NorthAfrica-main.zip -d ./  # Extract into repo root
          echo "Extraction complete."

      # Step 5: Verify extraction
      - name: List extracted files
        run: ls -l

      # Step 6: Commit and push extracted files
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Add extracted files from ZIP"
          git push origin main
